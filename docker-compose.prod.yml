# Docker Platform - Production Overrides
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overrides the development stack with production-hardened settings.

services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  control-plane:
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/docker_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GRPC_PORT: 50051
      LOG_LEVEL: warn
      TLS_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agent:
    restart: always
    environment:
      CONTROL_PLANE_URL: control-plane:50051
      AGENT_ID: ${AGENT_ID:-agent-prod-001}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Dashboard — nginx serving static SPA + API proxy
  dashboard:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Optional: Nginx reverse proxy for TLS termination
  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - control-plane
      - dashboard
