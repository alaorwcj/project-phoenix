apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docker-platform.fullname" . }}-control-plane
  labels:
    {{- include "docker-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  {{- if not .Values.controlPlane.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docker-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.secrets.databaseUrl | sha256sum }}
      labels:
        {{- include "docker-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      containers:
        - name: control-plane
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.controlPlane.grpcPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.controlPlane.port | quote }}
            - name: GRPC_PORT
              value: {{ .Values.controlPlane.grpcPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.controlPlane.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "docker-platform.fullname" . }}-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "docker-platform.fullname" . }}-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: {{ include "docker-platform.redisHost" . }}
            {{- if .Values.tls.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: {{ .Values.tls.certPath }}
            - name: TLS_KEY_PATH
              value: {{ .Values.tls.keyPath }}
            - name: TLS_CA_PATH
              value: {{ .Values.tls.caPath }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.existingSecret }}
      {{- end }}
