apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docker-platform.fullname" . }}-secrets
  labels:
    {{- include "docker-platform.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- else }}
  database-url: {{ printf "postgresql://dp_user:%s@%s-postgresql:5432/docker_platform" .Values.postgresql.auth.password (include "docker-platform.fullname" .) | b64enc | quote }}
  {{- end }}
