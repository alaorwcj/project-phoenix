name: Dashboard CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "dashboard/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "dashboard/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Type check
        run: npx tsc --noEmit
        working-directory: dashboard

      - name: Lint
        run: npm run lint --if-present
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

      - name: Build Docker image
        run: |
          docker build -t docker-platform-dashboard:latest -f dashboard/Dockerfile .
          docker save docker-platform-dashboard:latest -o /tmp/dashboard.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-image
          path: /tmp/dashboard.tar
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: dashboard-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/dashboard.tar

      - name: Push to registry (if configured)
        run: |
          if [ -n "${{ secrets.DOCKER_REGISTRY }}" ]; then
            echo "Pushing to registry (configure DOCKER_REGISTRY secret)"
            docker tag docker-platform-dashboard:latest ${{ secrets.DOCKER_REGISTRY }}/dashboard:latest
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker push ${{ secrets.DOCKER_REGISTRY }}/dashboard:latest
          fi

      - name: Deploy to production (if configured)
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "Deploying to ${{ secrets.DEPLOY_HOST }} (configure DEPLOY_HOST, DEPLOY_KEY, DEPLOY_USER)"
          fi
